MEMORY {
 H: start=$0000,size=$0010,file=%O,fill=yes;
 P0: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P1: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P2: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P3: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P4: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P5: start=$8000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P6: start=$a000,size=$2000,file=%O,fill=yes,fillval=$ff;
 P7: start=$a000,size=$2000,file=%O,fill=yes,fillval=$ff;
 RES: start=$8000,size=$c000,file=%O,fill=yes,fillval=$ff;
 K: start=$c000,size=$2000,file=%O,fill=yes,fillval=$ff;
 B: start=$e000,size=$0c1e,file=%O,fill=yes,fillval=$ff;
 S: start=$ec1e,size=$13dc,file=%O,fill=yes,fillval=$ff;
 V: start=$fffa,size=6,file=%O,fill=yes;
 C: start=0,size=$20000,file=%O,fill=yes;
 ZP: start=$80,size=4,type=rw;
 RAM: start=$500,size=$200,type=rw;
}
SEGMENTS {
 HEADER: load=H,type=ro;
 STAGE0: load=P0,type=ro;
 STAGE1: load=P1,type=ro;
 STAGE2: load=P2,type=ro;
 STAGE3: load=P3,type=ro;
 STAGE4: load=P4,type=ro;
 STAGE5: load=P5,type=ro;
 MAPS: load=P6,type=ro;
 ACTORS: load=P7,type=ro;
 RESERVED: load=RES,type=ro,optional=yes;
 CODE: load=K,type=ro;
 RODATA: load=K,type=ro;
 BOOT: load=B,type=ro;
 SOUND: load=S,type=ro;
 VECTORS: load=V,type=ro;
 GRAPHICS: load=C,type=ro;
 ZEROPAGE: load=ZP,type=zp;
 BSS: load=RAM,type=bss;
}
