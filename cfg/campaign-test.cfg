MEMORY {
  HEADER: start=$0000, size=$0010, file=%O;
  ZP: start=$0020, size=$0020, type=rw, file="";
  RAM: start=$0300, size=$0300, type=rw, file="";
  PRG: start=$8000, size=$7FFA, file=%O, fill=yes, fillval=$FF;
  VECTORS: start=$FFFA, size=$0006, file=%O;
  CHR: start=$0000, size=$2000, file=%O, fill=yes, fillval=$00;
}
SEGMENTS {
  HEADER: load=HEADER, type=ro;
  ZEROPAGE: load=ZP, type=zp;
  BSS: load=RAM, type=bss, define=yes;
  CODE: load=PRG, type=ro, define=yes;
  RODATA: load=PRG, type=ro, define=yes;
  VECTORS: load=VECTORS, type=ro;
  CHR: load=CHR, type=ro;
}
