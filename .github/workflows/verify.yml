name: Verify public source and native campaign

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public test dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y cc65
      - name: Public data and format checks
        run: python -m unittest discover -s tests -p test_public.py -v
      - name: Build pinned NES verification core
        shell: python
        run: |
          import io, pathlib, stat, subprocess, urllib.request, zipfile
          pin = 'ac0d00a7fc01166f84c7bac01d1084ebfd2b865e'
          with urllib.request.urlopen('https://codeload.github.com/libretro/libretro-fceumm/zip/' + pin, timeout=90) as response:
              data = response.read(64 * 1024 * 1024 + 1)
          if len(data) > 64 * 1024 * 1024:
              raise ValueError('Source archive too large')
          root = pathlib.Path('build/verification-core')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if sum(item.file_size for item in archive.infolist()) > 256 * 1024 * 1024:
                  raise ValueError('Expanded archive too large')
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(item.external_attr >> 16):
                      raise ValueError('Unsafe source path')
                  rel = pathlib.Path(*path.parts[1:])
                  if not rel.parts or item.is_dir():
                      continue
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.read(item))
          subprocess.run(['make', '-C', str(root), '-j2'], check=True)
      - name: Execute native 6502 campaign tests and negative control
        run: python tools/test_campaign_native.py --core build/verification-core/fceumm_libretro.so
      - name: Preserve scoped test report
        uses: actions/upload-artifact@v4
        with:
          name: public-and-native-test-report
          path: |
            reports/native_campaign_tests.json
            build/campaign/*.map
            build/campaign/*.lbl
          if-no-files-found: error
          retention-days: 30
